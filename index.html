    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f3ca20; /* اللون الأصفر من الشعار */
            --secondary-color: #ff3333; /* اللون الأحمر من الشعار */
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 50px;
        }

        /* تصميم الرأس (الهيدر) */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, rgba(18,18,18,0.9), rgba(18,18,18,0.9)), url('https://images.unsplash.com/photo-1513104890138-7c749659a591?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80') center/cover;
            border-bottom: 4px solid var(--primary-color);
        }

        .logo-container {
            display: inline-block;
            background-color: #000;
            border-radius: 50%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid var(--primary-color);
        }

        /* رسم مبسط لشعار 67 باستخدام CSS */
        .logo-text {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            line-height: 1;
            position: relative;
        }
        .logo-text span {
            color: var(--secondary-color);
            font-size: 1.5rem;
            position: absolute;
            bottom: -5px;
            right: -20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            color: #fff;
        }

        .slogan {
            color: var(--primary-color);
            font-size: 1.3rem;
            font-weight: bold;
            margin: 10px 0;
        }

        /* معلومات التواصل */
        .contact-info {
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 20px auto 0;
            max-width: 400px;
        }

        .contact-info p {
            margin: 5px 0;
            font-size: 1.1rem;
        }
        .contact-info a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* أزرار التصنيفات */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            overflow-x: auto;
            white-space: nowrap;
            /* دعم السحب باللمس */
            -webkit-overflow-scrolling: touch;
        }

        .category-btn {
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--text-color);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
        }

        /* شبكة عرض المنيو */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* تصميم بطاقة الوجبة */
        .menu-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-right: 4px solid var(--secondary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .item-details h3 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 1.2rem;
        }

        .item-details p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            background-color: var(--primary-color);
            padding: 5px 15px;
            border-radius: 8px;
            white-space: nowrap;
            margin-right: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        const menuContainer = document.getElementById('menu-container');

        categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => filterMenu(cat, btn);
            categoryContainer.appendChild(btn);
        });

        // دالة عرض المنيو
        function displayMenu(items) {
            menuContainer.innerHTML = '';
            items.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                
                // إظهار الوصف (المكونات) فقط إذا كان موجوداً
                const descHtml = item.desc ? `<p>${item.desc}</p>` : '';
                
                menuItem.innerHTML = `
                    <div class="item-details">
                        <h3>${item.name}</h3>
                        ${descHtml}
                    </div>
                    <div class="item-price">${item.price} د.ل</div>
                `;
                menuContainer.appendChild(menuItem);
            });
        }

        // دالة الفلترة
        function filterMenu(category, clickedBtn) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');

            if (category === "الكل") {
                displayMenu(menuData);
            } else {
                const filtered = menuData.filter(item => item.category === category);
                displayMenu(filtered);
            }
        }
